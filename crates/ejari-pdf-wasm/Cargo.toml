[package]
name = "admintools-ejari"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lopdf = { version = "=0.46.0", default-features = false, features = ["wasm_js"] }
sha2 = "=0.10.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.114"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
